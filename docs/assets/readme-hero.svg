<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Massive Agent Desk</title>
  <desc id="desc">Local-first agent workspace. Resume conversations, review exact drafts, keep durable receipts.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f7f7ef"/><stop offset="1" stop-color="#e9eddf"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#315c46" opacity=".09"/></pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#paper)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="42" y="42" width="52" height="52" rx="16" fill="#315c46"/>
  <text x="68" y="77" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fdfdf8">M</text>
  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="112" y="62" font-size="12" font-weight="600" letter-spacing="3" fill="#6e786c">LOCAL AGENT WORKSPACE</text>
    <text x="111" y="102" font-size="37" font-weight="700" letter-spacing="-1" fill="#283e34">Massive Agent Desk</text>
    <text x="44" y="152" font-size="18" fill="#526451">Your conversations. Your decisions. One desk.</text>
    <g font-size="13" font-weight="600" fill="#315c46">
      <rect x="44" y="186" width="142" height="35" rx="17.5" fill="#fdfdf8" stroke="#c5d2be"/>
      <text x="115" y="208" text-anchor="middle">RESUME A THREAD</text>
      <rect x="198" y="186" width="140" height="35" rx="17.5" fill="#fdfdf8" stroke="#c5d2be"/>
      <text x="268" y="208" text-anchor="middle">REVIEW THE TEXT</text>
      <rect x="350" y="186" width="139" height="35" rx="17.5" fill="#315c46"/>
      <text x="419" y="208" text-anchor="middle" fill="#fdfdf8">KEEP A RECEIPT</text>
    </g>
    <g transform="translate(814 47)">
      <rect width="338" height="186" rx="20" fill="#fdfdf8" stroke="#c5d2be"/>
      <circle cx="22" cy="24" r="4" fill="#315c46"/>
      <text x="36" y="29" font-size="12" letter-spacing="1" fill="#6e786c">CONNECTED BY CONTEXT</text>
      <path d="M24 48H314" stroke="#dce0d2"/>
      <rect x="22" y="65" width="212" height="33" rx="12" fill="#e9eddf"/>
      <rect x="105" y="111" width="211" height="33" rx="12" fill="#315c46"/>
      <path d="M36 81H172M120 127H275" stroke="#a7b99e" stroke-width="4" stroke-linecap="round"/>
      <text x="24" y="169" font-size="11" fill="#6e786c">CODEX / SQLITE / HUMAN REVIEW</text>
    </g>
  </g>
</svg>
